name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK not found at $APK"; exit 1; }
          ls -lh "$APK"

      - name: Verify package ID and version
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:" | tee badging.txt
          grep -q "name='com.aura.player'" badging.txt
          grep -q "versionName='1.0.0'" badging.txt

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
